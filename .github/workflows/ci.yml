name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        # Les tests API sont des tests d'intégration : ils tournent contre Neon
        # si le secret DATABASE_URL est défini, sinon `describe.runIf(hasDb)` les
        # saute (shared + mobile restent couverts).
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm -r test
